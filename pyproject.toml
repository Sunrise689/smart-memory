[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smy-memory-cli"
version = "0.1.0"
description = "Configuration-driven persistent memory CLI for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
smy = "smy:main"
